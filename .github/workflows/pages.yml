name: Deploy test preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Only the public site files are published. server/, feed/ and archive/ stay out of the preview.
      - name: Assemble static site
        run: |
          mkdir _site
          cp -r ./*.html ./*.css ./*.js data vendor _site/
          touch _site/.nojekyll
          # Test copy: keep it out of search engines so it does not compete with mypropertybox.co.uk
          sed -i 's|<head>|<head><meta name="robots" content="noindex,nofollow">|' _site/*.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
